<html>
<head>
    <style>
        .hover-example {
            background-color: blue; /* Green background */
            color: white;
            padding: 10px;
            text-align: center;
            cursor: alias;
        }

        .hover-example:hover {
            background-color: red;/* Darker green on hover */
        }
    </style>
</head>
<body>
    <div class="hover-example">Hover over me to change the background color!</div>
</body>
</html>
